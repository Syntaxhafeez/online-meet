services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - server

  coturn:
    image: coturn/coturn:4.6
    restart: unless-stopped
    command:
      - --listening-port=3478
      - --fingerprint
      - --lt-cred-mech
      - --realm=${TURN_REALM}
      - --user=${TURN_USERNAME}:${TURN_PASSWORD}
      - --external-ip=${MEDIASOUP_ANNOUNCED_IP}
      - --min-port=50000
      - --max-port=50040
      - --no-cli
      - --no-tls
      - --no-dtls
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "50000-50040:50000-50040/tcp"
      - "50000-50040:50000-50040/udp"

  server:
    build:
      context: ./server
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
    ports:
      - "40000-40100:40000-40100/tcp"
      - "40000-40100:40000-40100/udp"
    expose:
      - "4000"

volumes:
  caddy-data:
  caddy-config:
