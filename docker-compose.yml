services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: meet
      POSTGRES_PASSWORD: meet_password
      POSTGRES_DB: online_meet
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meet -d online_meet"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  coturn:
    image: coturn/coturn:4.6
    command: ["-c", "/etc/coturn/turnserver.conf"]
    environment:
      TURN_REALM: online-meet.local
      TURN_USERNAME: meet
      TURN_PASSWORD: meet_turn_password
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "50000-50040:50000-50040/udp"
    volumes:
      - ./infra/coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro

  server:
    build:
      context: ./server
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgresql://meet:meet_password@postgres:5432/online_meet?schema=public
      REDIS_URL: redis://redis:6379
      CLIENT_ORIGIN: http://localhost:3000
      MEDIASOUP_ANNOUNCED_IP: 127.0.0.1
    ports:
      - "4000:4000"
      - "40000-40100:40000-40100/udp"
      - "40000-40100:40000-40100/tcp"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_SIGNALING_URL: http://localhost:4000
    environment:
      NEXT_PUBLIC_SIGNALING_URL: http://localhost:4000
      NEXT_PUBLIC_STUN_URL: stun:localhost:3478
      NEXT_PUBLIC_TURN_URL: turn:localhost:3478
      NEXT_PUBLIC_TURN_USERNAME: meet
      NEXT_PUBLIC_TURN_PASSWORD: meet_turn_password
    ports:
      - "3000:3000"
    depends_on:
      - server

volumes:
  postgres-data:
